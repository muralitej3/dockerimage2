<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bird Sounds</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #e8f5e9; margin: 0; padding: 2rem; }
    h1 { color: #2e7d32; }
    .birds { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin-top: 2rem; }
    button {
      font-size: 1.1rem; padding: 1rem 1.5rem; border: 0; border-radius: 12px;
      background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.15); cursor: pointer;
    }
    button:hover { background: #c8e6c9; }
    .big { font-size: 2.5rem; display: block; }
  </style>
</head>
<body>
  <h1>Birds Making Sounds 🐦</h1>
  <p>Click a bird to hear it.</p>

  <div class="birds">
    <button onclick="chirp()"><span class="big">🐤</span>Sparrow</button>
    <button onclick="tweet()"><span class="big">🐦</span>Songbird</button>
    <button onclick="coo()"><span class="big">🕊️</span>Dove</button>
    <button onclick="caw()"><span class="big">🐦‍⬛</span>Crow</button>
  </div>

  <script>
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    function tone(freqStart, freqEnd, start, dur, type = 'sine', vol = 0.3) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const t = ctx.currentTime + start;
      osc.type = type;
      osc.frequency.setValueAtTime(freqStart, t);
      osc.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + dur);
    }

    function chirp() {
      ctx.resume();
      for (let i = 0; i < 4; i++) tone(2500, 3500, i * 0.15, 0.08);
    }

    function tweet() {
      ctx.resume();
      tone(1800, 3000, 0, 0.15);
      tone(3000, 2000, 0.18, 0.15);
      tone(2000, 3500, 0.36, 0.2);
      tone(3500, 2500, 0.6, 0.15);
    }

    function coo() {
      ctx.resume();
      tone(400, 350, 0, 0.4, 'sine', 0.4);
      tone(350, 300, 0.5, 0.5, 'sine', 0.4);
    }

    function caw() {
      ctx.resume();
      for (let i = 0; i < 2; i++) tone(500, 300, i * 0.4, 0.3, 'sawtooth', 0.25);
    }
  </script>
</body>
</html>
